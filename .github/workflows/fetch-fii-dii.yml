name: Fetch FII/DII Data

on:
  schedule:
    # Runs at 13:00 UTC = 18:30 IST, Monday-Friday (after NSE data is usually published).
    # GitHub's scheduler can lag by several minutes to an hour during busy periods,
    # so treat this as "sometime in the evening IST", not exact.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python scripts/fetch_fii_dii.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fii_dii_data.csv
          git diff --staged --quiet || git commit -m "Update FII/DII data ($(date -u +'%Y-%m-%d'))"
          git push
